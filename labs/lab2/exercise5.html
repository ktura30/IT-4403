<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercise 5: Visual Effects | Kaleb Tura</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#292f2a;font:17px/1.65 Georgia,"Times New Roman",serif}header{max-width:940px;margin:0 auto;padding:45px 24px 24px;border-bottom:2px solid #405b48}h1,h2,h3,nav,th,dt,footer{font-family:"Trebuchet MS",Arial,sans-serif}h1{font-size:clamp(27px,4vw,38px);font-weight:600;letter-spacing:-1px;line-height:1.2;margin:0 0 12px}header p{font-size:15px;color:#646b60;margin:0}nav{display:flex;gap:24px;flex-wrap:wrap;margin-top:22px;font-size:14px}a{color:#405b48;text-decoration-thickness:1px;text-underline-offset:4px}a:hover{color:#8c4f2e}a:focus-visible{outline:3px solid #ca9f57;outline-offset:4px}main{max-width:940px;margin:30px auto;padding:0 24px}article{padding:10px 0 25px;margin:0 0 25px;border-bottom:1px solid #dcded3}h2{font-size:23px;font-weight:600;line-height:1.3;margin:8px 0 15px}h3{font-size:18px;margin:26px 0 10px}pre{font:14px/1.65 "Courier New",monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#eeeede;border-left:3px solid #9caa89;padding:20px;border-radius:0}dl{display:grid;grid-template-columns:200px 1fr;gap:10px 24px}dt{font-size:15px;font-weight:600}dd{margin:0;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:16px}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #dedfd3}th{font-size:14px;color:#405b48;background:#eeeede}#status{font-size:15px;color:#646b60}ol{padding-left:28px}ol li{padding:12px 0 12px 8px;border-bottom:1px solid #dedfd3}ol li::marker{color:#8c4f2e;font-family:"Trebuchet MS",Arial,sans-serif}ul li{margin:8px 0}footer{max-width:940px;margin:25px auto;padding:0 24px;font-size:13px;color:#646b60}@media(max-width:600px){header{padding-top:30px}dl{grid-template-columns:1fr;gap:3px}dd{margin-bottom:14px}table{font-size:14px}td,th{padding:9px 5px}}button,input,select{font:16px "Trebuchet MS",Arial,sans-serif;padding:10px 13px;margin:5px 8px 8px 0;border:1px solid #a9b29f;border-radius:3px}button{background:#405b48;color:white;cursor:pointer}button:hover{background:#304535}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ca9f57;outline-offset:2px}label{display:block;margin-top:12px}#output,#result,#readout{padding:12px;background:#eeeede;min-height:48px}.panel{padding:22px;background:#eeeede;border:1px solid #9caa89}.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}#photo{width:100%;max-height:450px;object-fit:contain}td button{font-size:13px;padding:6px}@media(max-width:600px){.demo-grid{grid-template-columns:1fr}}</style></head><body><header><h1>Exercise 5: Visual Effects</h1><p>Kaleb Tura · IT-4403 · Kennesaw State University</p><nav><a href="index.html">Lab 2 Home</a><a href="https://ktura30.github.io/IT-4403/">Course Home</a></nav></header><main><article><p>This original effects demonstration can be compared with the instructor-provided example when available.</p><button id="hide">Hide</button><button id="show">Show</button><button id="toggle">Toggle</button><button id="fade">Fade toggle</button><button id="slide">Slide toggle</button><div id="panel" class="panel"><h2>A little jQuery animation</h2><p>Use the buttons to hide, show, fade, and slide this panel.</p></div></article></main><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script>$(function(){$('#hide').on('click',()=>$('#panel').stop(true,true).hide());$('#show').on('click',()=>$('#panel').stop(true,true).show());$('#toggle').on('click',()=>$('#panel').stop(true,true).toggle());$('#fade').on('click',()=>$('#panel').stop(true,true).fadeToggle(400));$('#slide').on('click',()=>$('#panel').stop(true,true).slideToggle(400));});</script></body></html>
