<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Single Book | Kaleb Tura</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#292f2a;font:17px/1.65 Georgia,"Times New Roman",serif}header{max-width:940px;margin:0 auto;padding:45px 24px 24px;border-bottom:2px solid #405b48}h1,h2,h3,nav,th,dt,footer{font-family:"Trebuchet MS",Arial,sans-serif}h1{font-size:clamp(27px,4vw,38px);font-weight:600;letter-spacing:-1px;line-height:1.2;margin:0 0 12px}header p{font-size:15px;color:#646b60;margin:0}nav{display:flex;gap:24px;flex-wrap:wrap;margin-top:22px;font-size:14px}a{color:#405b48;text-decoration-thickness:1px;text-underline-offset:4px}a:hover{color:#8c4f2e}a:focus-visible{outline:3px solid #ca9f57;outline-offset:4px}main{max-width:940px;margin:30px auto;padding:0 24px}article{padding:10px 0 25px;margin:0 0 25px;border-bottom:1px solid #dcded3}h2{font-size:23px;font-weight:600;line-height:1.3;margin:8px 0 15px}h3{font-size:18px;margin:26px 0 10px}pre{font:14px/1.65 "Courier New",monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#eeeede;border-left:3px solid #9caa89;padding:20px;border-radius:0}dl{display:grid;grid-template-columns:200px 1fr;gap:10px 24px}dt{font-size:15px;font-weight:600}dd{margin:0;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:16px}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #dedfd3}th{font-size:14px;color:#405b48;background:#eeeede}#status{font-size:15px;color:#646b60}ol{padding-left:28px}ol li{padding:12px 0 12px 8px;border-bottom:1px solid #dedfd3}ol li::marker{color:#8c4f2e;font-family:"Trebuchet MS",Arial,sans-serif}ul li{margin:8px 0}footer{max-width:940px;margin:25px auto;padding:0 24px;font-size:13px;color:#646b60}@media(max-width:600px){header{padding-top:30px}dl{grid-template-columns:1fr;gap:3px}dd{margin-bottom:14px}table{font-size:14px}td,th{padding:9px 5px}}.cover{float:left;width:145px;max-height:220px;object-fit:contain;margin:0 25px 18px 0}.no-cover{background:#eeeede;padding:30px 15px;text-align:center;font-size:14px}article{overflow:auto}#status{padding:12px 0;border-bottom:1px solid #dedfd3}@media(max-width:600px){.cover{float:none;display:block}}</style></head><body><header><h1>Single Book</h1><p>Kaleb Tura · IT-4403 · Kennesaw State University</p><nav aria-label="Main navigation"><a href="https://ktura30.github.io/IT-4403/">Course Home</a><a href="index.html">Milestone 1</a><a href="single-book.html">Single Book</a><a href="search-results.html">Search Results</a></nav></header><main><p>Book information from the saved edition record.</p><p id="status" role="status">Loading book data…</p><noscript>Enable JavaScript to display the books.</noscript><section id="content" aria-label="Book information"></section></main><footer>Individual Project · Milestone 1 · Open Library JSON Data Display</footer><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script>function value(v){if(v===null||v===undefined||v==='')return 'Not available';if(Array.isArray(v))return v.length?v.map(value).join(', '):'Not available';if(typeof v==='object')return value(v.value||v.name||v.key);return String(v);}
function row(dl,label,v){$('<dt>').text(label).appendTo(dl);$('<dd>').text(value(v)).appendTo(dl);}
function recordLink(container,key,label){if(typeof key==='string'&&/^\/(books|works|authors)\/[A-Za-z0-9]+$/.test(key))$('<a>').attr({href:'https://openlibrary.org'+key,target:'_blank',rel:'noopener'}).text(label).appendTo(container);}
function cover(container,id,title){if(Number.isInteger(Number(id))&&Number(id)>0){const img=$('<img>').addClass('cover').attr({src:'https://covers.openlibrary.org/b/id/'+Number(id)+'-M.jpg?default=false',alt:'Cover of '+value(title)});img.on('error',function(){$(this).replaceWith($('<div>').addClass('cover no-cover').text('Cover not available'));});container.append(img);}else container.append($('<div>').addClass('cover no-cover').text('Cover not available'));}
function render(data){if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('Invalid book record');const a=$('<article>');cover(a,Array.isArray(data.covers)?data.covers.find(id=>Number(id)>0):null,data.title);$('<h2>').text(value(data.title)).appendTo(a);const dl=$('<dl>').appendTo(a);
[['Subtitle',data.subtitle],['Publisher',data.publishers],['Publication date',data.publish_date],['Pages',data.number_of_pages],['ISBN-10',data.isbn_10],['ISBN-13',data.isbn_13],['Author references',data.authors],['First sentence',data.first_sentence],['Description',data.description],['Edition',data.edition_name],['Format',data.physical_format],['Languages',data.languages],['Subjects',data.subjects],['Publication places',data.publish_places],['Contributors',data.contributions??data.contributors],['Goodreads IDs',data.identifiers?.goodreads],['LibraryThing IDs',data.identifiers?.librarything],['Created',data.created],['Last modified',data.last_modified],['Archive identifier',data.ocaid],['Work references',data.works],['Open Library ID',data.key],['Revision',data.revision]].forEach(item=>row(dl,item[0],item[1]));
recordLink($('<p>').appendTo(a),data.key,'View this edition on Open Library');if(Array.isArray(data.authors))data.authors.forEach((author,i)=>recordLink($('<p>').appendTo(a),author.key,'View author record '+(i+1)));$('#content').empty().append(a);$('#status').text('Single-book data loaded.');}

if(typeof window.jQuery==='undefined'){document.getElementById('status').textContent='jQuery could not load. Check your internet connection.';}else{$(function(){$.getJSON('openlibrary-book.json').done(function(data){try{render(data);}catch(error){$('#status').text('The JSON structure could not be read: '+error.message);}}).fail(function(){$('#status').text('Could not load openlibrary-book.json. Put the instructor-provided file in this folder and open the page through a web server or GitHub Pages.');});});}
</script></body></html>
